<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Android Calculator</title>
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        /* Mobile Android Theme Styling */
        body {
            margin: 0;
            background-color: #17171c;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: flex-end;
            user-select: none;
        }

        /* Top Display Screen area */
        .screen {
            padding: 30px 20px;
            color: #ffffff;
            font-size: 48px;
            text-align: right;
            word-wrap: break-word;
            max-height: 150px;
            overflow-y: auto;
        }

        /* Android Style Button Keypad Grid Layout */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            background-color: #17171c;
        }

        /* Circular/Rounded Android Action Buttons */
        button {
            height: 75px;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: opacity 0.1s ease-in-out;
        }

        button:active {
            opacity: 0.6;
        }

        /* Number Button Colors */
        .number {
            background-color: #2e2f38;
            color: #ffffff;
        }

        /* Top Row Function Buttons (Clear) */
        .function {
            background-color: #4e505f;
            color: #ffffff;
        }

        /* Right Column Math Operators Column */
        .operator {
            background-color: #ff9f0a;
            color: #ffffff;
            font-size: 32px;
        }
    </style>
</head>
<body>

    <!-- Target display for current mathematical sequencing string -->
    <div class="screen" id="display">0</div>

    <!-- Phone Pad Keypad Grid Setup -->
    <div class="keypad">
        <button class="function" onclick="sendKey('C')">C</button>
        <button class="number" style="grid-column: span 2; visibility: hidden;"></button>
        <button class="operator" onclick="sendKey('/')">÷</button>

        <button class="number" onclick="sendKey('7')">7</button>
        <button class="number" onclick="sendKey('8')">8</button>
        <button class="number" onclick="sendKey('9')">9</button>
        <button class="operator" onclick="sendKey('*')">×</button>

        <button class="number" onclick="sendKey('4')">4</button>
        <button class="number" onclick="sendKey('5')">5</button>
        <button class="number" onclick="sendKey('6')">6</button>
        <button class="operator" onclick="sendKey('-')">−</button>

        <button class="number" onclick="sendKey('1')">1</button>
        <button class="number" onclick="sendKey('2')">2</button>
        <button class="number" onclick="sendKey('3')">3</button>
        <button class="operator" onclick="sendKey('+')">+</button>

        <button class="number" style="grid-column: span 2; border-radius: 40px;" onclick="sendKey('0')">0</button>
        <button class="number" onclick="sendKey('.')">.</button>
        <button class="operator" onclick="sendKey('=')">=</button>
    </div>

    <script>
        const displayDiv = document.getElementById('display');

        // Simple JavaScript function bridging button presses cleanly to Python 
        function sendKey(val) {
            eel.process_button(val)(function(result) {
                displayDiv.innerText = result === "" ? "0" : result;
            });
        }
    </script>
</body>
</html>
